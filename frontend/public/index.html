     <!-- GOOGLE TAG (GA4 + Google Ads) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4GGMXV1R1V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Domyślnie deny - user musi zaakceptować na banerze (CookiesBanner robi consent update)
      var consentAccepted = false;
      try { consentAccepted = localStorage.getItem('cookiesAccepted') === 'true'; } catch (e) {}
      var consentValue = consentAccepted ? 'granted' : 'denied';
      gtag('consent', 'default', {
        'ad_storage': consentValue,
        'analytics_storage': consentValue,
        'ad_user_data': consentValue,
        'ad_personalization': consentValue
      });

      gtag('js', new Date());

      // Nie wysyłamy do GA adresów zawierających klucze admina
      var isAdminUrl = /[?&]admin=/.test(location.search) || location.hash.indexOf('#/feedback/view') === 0 ||
        location.pathname.indexOf('/feedback/view') === 0;
      if (!isAdminUrl) {
        // GA4
        gtag('config', 'G-4GGMXV1R1V');

        // Google Ads (tylko konfiguracja – konwersja wysyłana z React)
        gtag('config', 'AW-17550154396');
      }
    </script>
